
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_DATABASE: comments_db
      MYSQL_USER: comments_user
      MYSQL_PASSWORD: comments_password_local
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
